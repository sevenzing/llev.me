<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>llev's car 🚗💥</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="game-title">🚗 LLev's Car <span class="title-emoji">💥</span></h1>
  <div id="scoreDisplay" class="score-display">Score: 0</div>
  
  <div id="heartDisplay" class="heart-display">
    <img src="static/heart.png" alt="Heart" class="heart-icon">
    <img src="static/heart.png" alt="Heart" class="heart-icon">
    <img src="static/heart.png" alt="Heart" class="heart-icon">
  </div>

  <div class="game-canvas-container">
    <canvas id="gameCanvas" class="game-canvas" width="400" height="500"></canvas>
  </div>

  <div class="game-controls">
    <fieldset class="difficulty-selector">
        <label class="difficulty-option">
          <input type="radio" name="difficulty" value="easy" class="difficulty-radio" />
          <span class="difficulty-label">Easy</span>
        </label>
        <label class="difficulty-option">
          <input type="radio" name="difficulty" value="normal" checked class="difficulty-radio" />
          <span class="difficulty-label">Normal</span>
        </label>
        <label class="difficulty-option">
          <input type="radio" name="difficulty" value="hard" class="difficulty-radio" />
          <span class="difficulty-label">Hard</span>
        </label>
        <label class="difficulty-option">
          <input type="radio" name="difficulty" value="insane" class="difficulty-radio" />
          <span class="difficulty-label">Insane</span>
        </label>
      </fieldset>

    <div class="button-container">
      <button id="startBtn" class="game-button start-button">Start</button>
      <button id="stopBtn" class="game-button stop-button" disabled>Stop</button>
      <button id="watchBtn" class="game-button watch-button">Just Watch</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
